<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Redefinir senha - Editai</title>
  <!--[if mso]>
  <noscript>
    <xml>
      <o:OfficeDocumentSettings>
        <o:PixelsPerInch>96</o:PixelsPerInch>
      </o:OfficeDocumentSettings>
    </xml>
  </noscript>
  <![endif]-->
</head>
<body style="margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif; background: linear-gradient(180deg, #2E8EE6 0%, #34A1F6 100%); min-height: 100vh;">
  <table role="presentation" cellspacing="0" cellpadding="0" border="0" width="100%" style="background: linear-gradient(180deg, #2E8EE6 0%, #34A1F6 100%); padding: 40px 20px;">
    <tr>
      <td align="center">
        <!-- Card principal -->
        <table role="presentation" cellspacing="0" cellpadding="0" border="0" width="100%" style="max-width: 480px; background: #FFFFFF; border-radius: 12px; box-shadow: 0 4px 24px rgba(0, 0, 0, 0.12); overflow: hidden;">
          <!-- Header com gradiente -->
          <tr>
            <td style="background: linear-gradient(90deg, #1E88E5 0%, #4FC3F7 100%); padding: 24px 32px; text-align: center;">
              <table role="presentation" cellspacing="0" cellpadding="0" border="0" width="100%">
                <tr>
                  <td align="center">
                    <span style="font-size: 24px; font-weight: 700; color: #FFFFFF; letter-spacing: -0.5px;">Editai</span>
                  </td>
                </tr>
              </table>
            </td>
          </tr>
          <!-- Conteúdo -->
          <tr>
            <td style="padding: 40px 32px;">
              <!-- Ícone -->
              <table role="presentation" cellspacing="0" cellpadding="0" border="0" width="100%">
                <tr>
                  <td align="center" style="padding-bottom: 24px;">
                    <div style="width: 80px; height: 80px; background: #E8F4FD; border-radius: 12px; display: inline-flex; align-items: center; justify-content: center;">
                      <span style="font-size: 40px;">🔐</span>
                    </div>
                  </td>
                </tr>
              </table>
              <!-- Título -->
              <table role="presentation" cellspacing="0" cellpadding="0" border="0" width="100%">
                <tr>
                  <td align="center" style="padding-bottom: 16px;">
                    <h1 style="margin: 0; font-size: 24px; font-weight: 700; color: #333333;">Redefinir senha</h1>
                  </td>
                </tr>
              </table>
              <!-- Texto -->
              <table role="presentation" cellspacing="0" cellpadding="0" border="0" width="100%">
                <tr>
                  <td align="center" style="padding-bottom: 32px;">
                    <p style="margin: 0; font-size: 16px; line-height: 1.5; color: #666666;">Olá, clique no botão abaixo para redefinir sua senha.</p>
                  </td>
                </tr>
              </table>
              <!-- Botão -->
              <table role="presentation" cellspacing="0" cellpadding="0" border="0" width="100%">
                <tr>
                  <td align="center" style="padding-bottom: 32px;">
                    <a href="{{ .ConfirmationURL }}" style="display: inline-block; padding: 14px 40px; background: #1E88E5; color: #FFFFFF; font-size: 16px; font-weight: 600; text-decoration: none; border-radius: 8px;">Redefinir senha</a>
                  </td>
                </tr>
              </table>
              <!-- Suporte -->
              <table role="presentation" cellspacing="0" cellpadding="0" border="0" width="100%">
                <tr>
                  <td align="center" style="padding-bottom: 24px;">
                    <p style="margin: 0; font-size: 13px; color: #9E9E9E;">Precisa de ajuda? Entre em contato pelo suporte.</p>
                  </td>
                </tr>
              </table>
              <!-- Footer links -->
              <table role="presentation" cellspacing="0" cellpadding="0" border="0" width="100%">
                <tr>
                  <td align="center">
                    <p style="margin: 0; font-size: 12px; color: #9E9E9E;">
                      <a href="{{ .SiteURL }}/politicas_de_privacidade" style="color: #9E9E9E; text-decoration: underline;">Políticas de Privacidade</a>
                      &nbsp;|&nbsp;
                      <a href="{{ .SiteURL }}/termos_de_uso" style="color: #9E9E9E; text-decoration: underline;">Termos de Uso</a>
                    </p>
                  </td>
                </tr>
              </table>
            </td>
          </tr>
        </table>
      </td>
    </tr>
  </table>
</body>
</html>
